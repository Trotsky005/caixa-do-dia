<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caixa do Dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra fixa com a frente (loja + caixa/financeiro/banco) e o dia; abas abaixo; cada aba é uma mesa de trabalho em 1–2 colunas. Cor da loja: Areias = areia, Barreiro = barro, Banco = petróleo. */
:root{
  --bg:#eceeea; --surface:#fbfcfa; --surface-2:#f2f4f0; --ink:#1b211e; --muted:#5d6862; --line:#d3d9d3;
  --accent:#21545c; --accent-soft:#dbe8e7; --on-accent:#ffffff;
  --areias:#a97a26; --barreiro:#9a4b32; --banco:#21545c;
  --in:#1f7a45; --in-soft:#dff0e4; --out:#b0362b; --out-soft:#f8e2df; --warn:#8f5d00; --warn-soft:#f6ecd5;
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --loja:var(--areias);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a1f1d; --surface-2:#222826; --ink:#e7ece9; --muted:#9ba7a1; --line:#313a36;
  --accent:#74b6bb; --accent-soft:#1e3537; --on-accent:#0d1514;
  --areias:#d9a64b; --barreiro:#d68264; --banco:#74b6bb;
  --in:#62c78e; --in-soft:#173323; --out:#f08377; --out-soft:#3b1d1a; --warn:#e3ad40; --warn-soft:#3a2c12;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a1f1d; --surface-2:#222826; --ink:#e7ece9; --muted:#9ba7a1; --line:#313a36;
  --accent:#74b6bb; --accent-soft:#1e3537; --on-accent:#0d1514;
  --areias:#d9a64b; --barreiro:#d68264; --banco:#74b6bb;
  --in:#62c78e; --in-soft:#173323; --out:#f08377; --out-soft:#3b1d1a; --warn:#e3ad40; --warn-soft:#3a2c12;
  color-scheme:dark }
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
body[data-loja="barreiro"]{--loja:var(--barreiro)}
body[data-loja="banco"]{--loja:var(--banco)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top::before{content:"";display:block;height:4px;background:var(--loja)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-size:20px;font-weight:800}
.brand small{font-size:12px;color:var(--muted)}
.frentes{display:flex;flex-wrap:wrap;gap:8px}
.grp{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.grp-l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:0 8px 0 10px;color:var(--muted)}
.grp button{border:0;background:transparent;padding:7px 11px;cursor:pointer;font-weight:500}
.grp button[aria-pressed="true"]{background:var(--loja);color:#fff}
:root[data-theme="dark"] .grp button[aria-pressed="true"]{color:#141414}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .grp button[aria-pressed="true"]{color:#141414}}
.diasel{display:flex;align-items:center;gap:4px}
.diasel input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--loja)}
.tabs svg{width:13px;height:13px;vertical-align:-1px;margin-left:4px}

main{padding-block:18px 60px}
.titlebar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
.titlebar h2{font-size:24px;font-weight:700}
.titlebar .sub{color:var(--muted)}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:14px;border:1px solid var(--line);background:var(--surface-2)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.banner.ok{background:var(--in-soft);border-color:transparent}
.banner.bad{background:var(--out-soft);border-color:transparent}

.cols{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:12px}

/* tipos de lançamento */
.tipos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:14px}
.tipos button{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 10px;cursor:pointer;font-size:13.5px;font-weight:500;display:flex;gap:7px;align-items:center}
.tipos button .dot{width:8px;height:8px;border-radius:50%;flex:none}
.tipos button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.dot.e{background:var(--in)} .dot.s{background:var(--out)} .dot.t{background:var(--accent)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f > span.req::after{content:" *";color:var(--out)}
.inp,select.inp,textarea.inp{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:400;font-size:15px}
.inp:focus,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.inp.big{font-family:var(--f-num);font-size:22px;font-weight:600;padding:8px 10px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.row3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.loja{background:var(--loja);border-color:var(--loja);color:#fff}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* resumo do dia */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-num);font-size:20px;font-weight:600;margin-top:2px}
.tile .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile.e .v{color:var(--in)} .tile.s .v{color:var(--out)}
.tile.areias{border-top:3px solid var(--areias)} .tile.barreiro{border-top:3px solid var(--barreiro)} .tile.banco{border-top:3px solid var(--banco)}
.formas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px}
.chip b{font-family:var(--f-num);font-weight:600}

/* tabelas */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.e{color:var(--in)} td.s{color:var(--out)}
tr.excl td{text-decoration:line-through;color:var(--muted)}
tfoot td{font-weight:700;background:var(--surface-2)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);border:1px solid var(--line)}
.pill.e{background:var(--in-soft);color:var(--in);border-color:transparent}
.pill.s{background:var(--out-soft);color:var(--out);border-color:transparent}
.pill.t{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.w{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--out);cursor:pointer;font-size:13px;padding:0}
.sub2{font-size:12.5px;color:var(--muted)}

/* fechamento */
.fech-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:900px){.fech-grid{grid-template-columns:minmax(0,1fr)}}
.sec-n{font-family:var(--f-num);font-size:12px;color:var(--loja);font-weight:600;margin-right:6px}
.ced{display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr);gap:6px 10px;align-items:center;font-size:14px}
.ced .inp{padding:6px 8px;text-align:right;font-family:var(--f-num)}
.ced .tot{font-family:var(--f-num);text-align:right}
.ced .lbl{display:flex;align-items:center;gap:8px}
.nota{display:inline-block;width:26px;height:14px;border-radius:3px;border:1px solid var(--line)}
.moeda{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);margin:0 6px}
.conf td .pill{min-width:58px;text-align:center}
.dif-ok{color:var(--in)} .dif-bad{color:var(--out)}

/* contas */
.filtros{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.filtros button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500}
.filtros button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.paypanel{background:var(--surface-2);border-top:1px dashed var(--line)}
.paypanel .inner{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:6px 0}
.paypanel label.f{min-width:130px;flex:1}
details.card summary{cursor:pointer;font-family:var(--f-display);font-weight:700}
details.card[open] summary{margin-bottom:12px}

/* histórico */
.lock{max-width:380px;margin:40px auto}
.histbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.histbar label.f{min-width:140px}
.sect{margin-top:22px}
.sect h3{font-size:16px;margin-bottom:8px}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}

.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login{width:100%;max-width:640px;padding:28px 32px;display:flex;flex-direction:column;gap:16px}
.login .stack{gap:14px}
.login-brand{display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--areias);padding-top:12px}
.login-brand h1{font-size:26px;font-weight:800}
.lbl-up{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-width:110px;white-space:nowrap;padding-inline:16px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:10px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fixa{font-family:var(--f-display);font-weight:700;padding:6px 12px;border-radius:999px;background:var(--loja);color:#fff}
.subcard{background:var(--surface-2);padding:12px}
.trocov{font-size:22px;font-weight:600;color:var(--ink);padding:8px 0}
a.btn{text-decoration:none;display:inline-block}
.pwd{position:relative}
.pwd .inp{padding-right:110px}
.pwd-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px;padding:6px 8px;border-radius:7px}
.pwd-btn:hover{color:var(--ink);background:var(--surface-2)}
.pwd-btn svg{width:18px;height:18px}
.pwd-btn[aria-pressed="true"] svg{opacity:.55}
@media (max-width:480px){.login{padding:20px 16px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div id="login" class="loginwrap">
  <div class="card login">
    <div class="login-brand"><h1>Caixa do Dia</h1><span class="muted">Areias · Barreiro · Banco</span></div>
    <form id="f-login" class="stack" hidden>
      <div class="f"><span class="lbl-up">Cidade</span>
        <div class="seg" id="lg-cidade"><button type="button" data-lgc="areias">Areias</button><button type="button" data-lgc="barreiro">Barreiro</button><button type="button" data-lgc="banco">Banco</button><button type="button" data-lgc="admin">Administrador</button></div>
      </div>
      <div class="f" id="lg-sub-box" hidden><span class="lbl-up">Acesso</span>
        <div class="seg" id="lg-sub"><button type="button" data-lgs="cx">Caixa</button><button type="button" data-lgs="fin">Financeiro</button></div>
      </div>
      <label class="f" for="lg-senha"><span>Senha</span></label>
      <div class="pwd"><input class="inp" type="password" id="lg-senha" autocomplete="current-password"><button type="button" class="pwd-btn" data-act="ver-senha" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Mostrar</span></button></div>
      <button class="btn pri" type="submit" id="lg-entrar">Entrar</button>
    </form>
    <p class="hint" id="lg-msg"></p>
  </div>
</div>

<div id="app" hidden>
<header class="top">
  <div class="wrap top-row">
    <div class="brand"><h1>Caixa do Dia</h1><small id="conn"></small></div>
    <nav class="frentes" aria-label="Frente" id="sel-frentes">
      <div class="grp"><span class="grp-l">Cidade</span><button data-cidade="areias">Areias</button><button data-cidade="barreiro">Barreiro</button><button data-cidade="banco">Banco</button></div>
      <div class="grp" id="sel-sub"><button data-sub="cx">Caixa</button><button data-sub="fin">Financeiro</button></div>
    </nav>
    <div class="fixa" id="frente-fixa" hidden></div>
    <div class="diasel">
      <button class="iconbtn" data-act="dia-prev" aria-label="Dia anterior">‹</button>
      <input type="date" id="dia" aria-label="Dia">
      <button class="iconbtn" data-act="dia-next" aria-label="Próximo dia">›</button>
    </div>
    <button class="btn sm" data-act="sair">Sair</button>
  </div>
  <div class="wrap tabs" role="tablist">
    <button role="tab" data-tab="lancar">Lançamentos</button>
    <button role="tab" data-tab="fech">Fechamento</button>
    <button role="tab" data-tab="contas">Contas a pagar</button>
    <button role="tab" data-tab="receber">Boletos a receber</button>
    <button role="tab" data-tab="hist" id="tab-hist">Histórico</button>
  </div>
</header>

<main class="wrap">
  <div id="global-banner"></div>
  <section id="v-lancar" data-view="lancar">
    <div class="titlebar"><h2 id="lanc-title"></h2><span class="sub" id="lanc-sub"></span></div>
    <div id="lanc-banner"></div>
    <div class="cols">
      <div class="card">
        <div class="tipos" id="tipos"></div>
        <form id="f-lanc" class="stack" autocomplete="off"></form>
      </div>
      <div style="min-width:0">
        <div id="banco-ajuste"></div>
        <div class="tiles" id="dia-tiles"></div>
        <div class="formas" id="dia-formas"></div>
        <div class="tablewrap" id="lanc-tabela"><div class="empty">Carregando…</div></div>
      </div>
    </div>
  </section>
  <section id="v-fech" data-view="fech" hidden></section>
  <section id="v-contas" data-view="contas" hidden></section>
  <section id="v-receber" data-view="receber" hidden></section>
  <section id="v-hist" data-view="hist" hidden></section>
</main>
</div>
<div id="toast" hidden></div>

<script>
(function(){
"use strict";
// ---------- constantes ----------
const FRENTES = [
  {id:"cx-areias",   nome:"Caixa Areias",        loja:"areias",   tipo:"caixa"},
  {id:"fin-areias",  nome:"Financeiro Areias",   loja:"areias",   tipo:"fin"},
  {id:"cx-barreiro", nome:"Caixa Barreiro",      loja:"barreiro", tipo:"caixa"},
  {id:"fin-barreiro",nome:"Financeiro Barreiro", loja:"barreiro", tipo:"fin"},
  {id:"banco",       nome:"Banco",               loja:"banco",    tipo:"banco"}
];
const FR = Object.fromEntries(FRENTES.map(f=>[f.id,f]));
const PERFIS = Object.assign({admin:"Administrador"}, Object.fromEntries(FRENTES.map(f=>[f.id,f.nome])));
const TIPOS = {
  receb:   {nome:"Recebimento",            cls:"e", sent:"E"},
  boleto:  {nome:"Boleto emitido",         cls:"t", sent:"E"},
  conta:   {nome:"Pagar conta",            cls:"s", sent:"S"},
  sangria: {nome:"Sangria",                cls:"s", sent:"S"},
  adiant:  {nome:"Adiantamento",           cls:"s", sent:"S"},
  salario: {nome:"Pagamento funcionário",  cls:"s", sent:"S"},
  despesa: {nome:"Outra saída",            cls:"s", sent:"S"},
  transf:  {nome:"Transferência",          cls:"t", sent:"S"},
  deposito:{nome:"Depósito no banco",      cls:"t", sent:"S"},
  entrada: {nome:"Outra entrada",          cls:"e", sent:"E"},
  ajuste:  {nome:"Ajuste de saldo",        cls:"t", sent:"E"}
};
const TIPOS_FRENTE = {
  caixa:["receb","boleto","conta","sangria","adiant","salario","despesa","transf","deposito","entrada"],
  fin:  ["receb","boleto","conta","sangria","adiant","salario","despesa","transf","deposito","entrada"],
  banco:["entrada","boleto","conta","salario","adiant","despesa","transf"]
};
const FORMAS = {din:"Dinheiro", pix:"PIX", deb:"Cartão débito", cred:"Cartão crédito", chq:"Cheque de cliente", cupom:"Cupom de troca", banco:"Banco", boleto:"Boleto", ted:"TED / transferência", cc:"Cartão de crédito (empresa)", chqemp:"Cheque da empresa"};
const CEDULAS = [
  ["c200",200,"Cédula R$ 200","#b9b2a4"],["c100",100,"Cédula R$ 100","#7aa3c9"],["c50",50,"Cédula R$ 50","#d6a35f"],
  ["c20",20,"Cédula R$ 20","#e3cf6a"],["c10",10,"Cédula R$ 10","#c98a7a"],["c5",5,"Cédula R$ 5","#a991c4"],["c2",2,"Cédula R$ 2","#8fb3c4"],
  ["m100",1,"Moeda R$ 1,00",null],["m050",.5,"Moeda R$ 0,50",null],["m025",.25,"Moeda R$ 0,25",null],["m010",.1,"Moeda R$ 0,10",null],["m005",.05,"Moeda R$ 0,05",null]
];

// ---------- utilidades ----------
const $ = s=>document.querySelector(s);
const h = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Endereço do Apps Script (planilha "Caixa do Dia – Dados" › Extensões › Apps Script › Implantar › link /exec).
const API_URL = "https://script.google.com/macros/s/AKfycby_juV_dFQtY8G9h9sFbcpEHcKNjDxCD_R96ofGZ7qdjR7tHpy0j1x_wQLkVJhuiAnqNw/exec";
const temGoogle = /^https?:\/\//.test(API_URL);
async function call(acao,args){
  if(!temGoogle) throw new Error("Falta configurar o endereço do servidor (API_URL) no arquivo index.html.");
  let r, resp, texto="";
  try{
    resp=await fetch(API_URL,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:S.token,acao,args:args||{}})});
    texto=await resp.text();
  }catch(e){ throw new Error("Sem conexão com o servidor. Confira a internet e tente de novo. ("+(e.message||e)+")"); }
  try{ r=JSON.parse(texto); }catch(e){ r=null; }
  if(r&&r.ok) return r.data;
  let m=r&&r.erro;
  if(!m){
    const det=(r&&(r.message||r.msg||r.error||r.code))||texto.slice(0,160)||"sem resposta";
    if(/doPost/i.test(texto)) m="O Apps Script ainda está na versão antiga (sem doPost). Cole o Code.gs novo e publique uma Nova versão da implantação.";
    else if(/<html/i.test(texto)) m="O Apps Script não liberou o acesso. Confira a implantação: Executar como \"Eu\" e Quem pode acessar \"Qualquer pessoa\".";
    else m="Erro no servidor (HTTP "+resp.status+"): "+det;
  }
  if(m.indexOf("SESSAO")>=0) sair("Sua sessão expirou. Entre de novo.");
  throw new Error(m.replace(/^SESSAO:\s*/,""));
}

// ---------- cálculo ----------
function lancsAtivos(day){ return Object.values((day&&day.lanc)||{}).filter(l=>l&&l.valor!=null&&!l.excluido).sort((a,b)=>(a.hora||"").localeCompare(b.hora||"")||(a.ts||0)-(b.ts||0)); }
function zeros(){return {din:0,pix:0,deb:0,cred:0,chq:0,cupom:0,banco:0,cc:0};}
function contagem(ced){ ced=ced||{}; let t=0; for(const [k,val] of CEDULAS) t+=(parseInt(ced[k],10)||0)*val; return r2(t); }
function sugestaoAbertura(prev){
  if(!prev) return {din:0,chq:0,de:null};
  const f=prev.fech||{};
  if(f.status==="fechado") return {din:contagem(f.ced), chq:num(f.chqGaveta), de:prev.data, fechado:true};
  const c=calcDia(prev,null); return {din:c.espDin, chq:c.espChq, de:prev.data, fechado:false};
}
function calcDia(day, prev){
  const E=zeros(), Sd=zeros(), R=zeros();
  for(const l of lancsAtivos(day)){
    const v=+l.valor||0, f=l.forma||"din";
    if(l.sentido==="E"){E[f]=(E[f]||0)+v; if(l.tipo==="receb") R[f]=(R[f]||0)+v;} else Sd[f]=(Sd[f]||0)+v;
  }
  const fech=(day&&day.fech)||{};
  const sug=sugestaoAbertura(prev);
  const abertDin = fech.abertDin!=null&&fech.abertDin!=="" ? num(fech.abertDin) : sug.din;
  const abertChq = fech.abertChq!=null&&fech.abertChq!=="" ? num(fech.abertChq) : sug.chq;
  const espDin=r2(abertDin+E.din-Sd.din), espChq=r2(abertChq+E.chq-Sd.chq);
  const totE=r2(Object.values(E).reduce((a,b)=>a+b,0)), totS=r2(Object.entries(Sd).reduce((a,[k,b])=>(k==="cc"||k==="chqemp")?a:a+b,0));
  return {E,S:Sd,R,abertDin,abertChq,espDin,espChq,contado:contagem(fech.ced),chqGav:num(fech.chqGaveta),sis:fech.sis||{},maq:fech.maq||{},totE,totS,sug};
}
function conferencia(c){
  const rows=[], add=(item,esp,conf,obs,usar)=>rows.push({item,esp,conf,dif:r2(conf-esp),obs,usar});
  const tem=v=>v!=null&&v!=="";
  add("Dinheiro na gaveta (esperado × contado)", c.espDin, c.contado, "abertura + entradas − saídas em dinheiro", true);
  add("Dinheiro: sistema × lançado", num(c.sis.din), c.R.din, "vendas em dinheiro do sistema × recebimentos lançados", tem(c.sis.din));
  add("PIX: sistema × lançado", num(c.sis.pix), c.R.pix, "", tem(c.sis.pix));
  const maqCart=r2(num(c.maq.deb)+num(c.maq.cred));
  add("Cartão: sistema × maquininha", num(c.sis.cart), maqCart, "débito + crédito da maquininha", tem(c.sis.cart)||maqCart>0);
  add("Cartão: maquininha × lançado", maqCart, r2(c.R.deb+c.R.cred), "", maqCart>0||(c.R.deb+c.R.cred)>0);
  add("Cheques (esperado × na gaveta)", c.espChq, c.chqGav, "", c.espChq>0||c.chqGav>0);
  return rows.filter(r=>r.usar);
}
function aplicaSaldo(bal,F,l){
  if(!l||l.excluido) return; const v=+l.valor||0, s=l.sentido==="E"?1:-1;
  if(F==="banco"){ if(l.forma!=="cc"&&l.forma!=="chqemp") bal.banco.total+=s*v; return; }
  if(l.forma==="din") bal[F].din+=s*v;
  else if(l.forma==="chq") bal[F].chq+=s*v;
  else if(l.forma==="pix") bal.banco.total+=s*v;
  else if((l.forma==="deb"||l.forma==="cred")&&s>0) bal.banco.total+=v;
}

function updateTroco(){
  const box=document.getElementById("l-troco-box"); if(!box) return;
  const din=(document.getElementById("l-forma")||{}).value==="din"; box.hidden=!din;
  const out=document.getElementById("l-troco"); if(!din||!out) return;
  const v=num($("#l-valor").value), r=num($("#l-receb").value);
  if(!r){ out.textContent="–"; out.style.color=""; return; }
  const t=r2(r-v); out.textContent=t<0?"faltam "+fmt(-t):fmt(t); out.style.color=t<0?"var(--out)":"";
}
function vencCartaoSugerido(cartao){
  let mapa={}; try{mapa=JSON.parse(lsGet("cdd.cartoes")||"{}")}catch(e){}
  const dia=mapa[cartao]; if(!dia) return "";
  const t=hoje(); const d=new Date(t+"T12:00:00"); d.setDate(1);
  for(let i=0;i<3;i++){ const ult=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); const c=new Date(d.getFullYear(),d.getMonth(),Math.min(dia,ult),12); if(iso(c)>t) return iso(c); d.setMonth(d.getMonth()+1); }
  return "";
}
function updateCC(){

function updateChq(){

function chequesMaos(F){ return S.chqTerc.filter(q=>q.status==="em_maos"&&q.frente===F).sort((a,b)=>(a.bomPara||"").localeCompare(b.bomPara||"")); }
function optsChequesMaos(F){ const l=chequesMaos(F); return l.length?`<option value="">Escolha o cheque…</option>`+l.map(q=>`<option value="${h(q.id)}">${br(q.bomPara).slice(0,5)} · ${h(q.emitente)}${q.numero?" · nº "+h(q.numero):""} · ${fmt(q.valor)}</option>`).join(""):`<option value="">Nenhum cheque de cliente em mãos aqui</option>`; }
function aplicaChequeSel(){ const s=document.getElementById("l-cssel"), v=document.getElementById("l-valor"); if(!s||!v) return; const q=S.chqTerc.find(x=>x.id===s.value); v.value=q?numStr(q.valor):""; updateCC(); }
function updateBolPrev(){

function applyLock(){

async function salvarLanc(ev){
  ev.preventDefault();
  const F=S.frente, D=S.data, t=S.tipo, g=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const msg=$("#l-msg"), valor=num(g("l-valor"));
  if(valor<=0){ msg.textContent="Digite um valor maior que zero."; $("#l-valor").focus(); return; }
  const desc=g("l-desc"), forma=g("l-forma")||"din", oper=g("l-oper");
  if(t==="boleto"&&(!desc||!g("l-venc"))){ msg.textContent="Preencha cliente e vencimento."; return; }
  if((t==="conta"&&!desc&&!g("l-conta"))||(["despesa","entrada","sangria"].includes(t)&&!desc)){ msg.textContent="Preencha a descrição."; return; }
  if((t==="adiant"||t==="salario")&&!g("l-func")){ msg.textContent="Informe o funcionário."; return; }
  const p={frente:F,data:D,tipo:t,forma,valor,desc,doc:g("l-doc"),obs:g("l-obs"),oper,func:g("l-func"),origem:g("l-origem"),dest:g("l-dest"),contaId:g("l-conta")};
  if(t==="boleto") p.boleto={venc:g("l-venc"),n:parseInt(g("l-parc"),10)||1};
  if(t==="receb"&&forma==="din"&&g("l-receb")){ const rec=num(g("l-receb")); if(rec<valor){ msg.textContent="O dinheiro recebido é menor que o valor da venda."; return; } p.recebido=rec; }
  if(forma==="cc"){
    const cartao=g("l-cartao"), venc1=g("l-ccvenc");
    if(!cartao||!venc1){ msg.textContent="Informe o cartão e o vencimento da 1ª parcela."; return; }
    let mapa={}; try{mapa=JSON.parse(lsGet("cdd.cartoes")||"{}")}catch(e){} mapa[cartao]=parseInt(venc1.slice(8,10),10); lsSet("cdd.cartoes",JSON.stringify(mapa));
    p.cc={cartao,venc1,n:parseInt(g("l-parc"),10)||1};
  }
  if(forma==="chq"&&TIPOS[t].sent==="E"){
    if(!g("l-ctemit")||!g("l-ctbom")){ msg.textContent="Informe de quem é o cheque e o bom para."; return; }
    p.chqTerc={emitente:g("l-ctemit"),bomPara:g("l-ctbom"),numero:g("l-ctnum"),banco:g("l-ctbanco")};
  }
  if(forma==="chq"&&TIPOS[t].sent!=="E"){
    if(!g("l-cssel")){ msg.textContent="Escolha qual cheque de cliente está sendo usado."; return; }
    p.chqTercId=g("l-cssel"); p.repassadoPara=g("l-cspara");
  }
  if(forma==="chqemp"){
    if(!g("l-chnum")||!g("l-chbom")){ msg.textContent="Informe o número do cheque e o bom para."; return; }
    p.cheque={numero:g("l-chnum"),bomPara:g("l-chbom"),nominal:g("l-chnom")};
  }
  if(oper) lsSet("cdd.operador",oper);
  const btn=$("#l-salvar"); btn.disabled=true; msg.textContent="Salvando…";
  try{
    const r=await call("salvarLanc",p);
    toast(r.msg||"Salvo.");
    renderLancForm(); const v=$("#l-valor"); if(v) v.focus();
    carregarDia(true);
    if(t==="conta"||forma==="cc") carregarContas();
    if(forma==="chqemp") carregarCheques();
    if(forma==="chq") carregarChequesTerc();
    if(t==="boleto") carregarReceber();
  }catch(e){ msg.textContent=e.message; btn.disabled=false; }
}

function atualizaDifAjuste(){
  const c=$("#aj-calc"), d=$("#aj-dif"); if(!c||!d) return;
  c.textContent=S.saldoBanco==null?"…":fmt(S.saldoBanco);
  const pv=$("#aj-prev"); if(pv) pv.innerHTML=S.saldoBanco==null?"":`Cheques a compensar <b class="num">− ${fmt(S.aCompensar||0)}</b> · saldo previsto <b class="num">${fmt(S.saldoBanco-(S.aCompensar||0))}</b>`;
  const v=($("#aj-real").value||"").trim(); if(!v||S.saldoBanco==null){ d.textContent="–"; d.style.color=""; return; }

async function carregarSaldoBanco(){
  if(S.frente!=="banco"||!(isAdmin()||S.perfil==="banco")) return;
  try{ const r=await call("saldoBanco"); S.saldoBanco=r.saldo; S.aCompensar=r.aCompensar||0; renderBancoCard(); atualizaDifAjuste(); }catch(e){}
}
async function ajustarSaldo(btn){
  const m=$("#aj-msg"), real=($("#aj-real").value||"").trim(), just=($("#aj-just").value||"").trim();
  if(!real){ m.textContent="Digite o saldo que aparece no extrato."; return; }
  if(!just){ m.textContent="Escreva a justificativa da diferença."; return; }
  btn.disabled=true; m.textContent="Atualizando…";
  try{ const r=await call("ajusteBanco",{saldoReal:num(real),justificativa:just,data:S.data,oper:lsGet("cdd.operador")||""});

  btn.disabled=false;
}

  const fechado=diaFechado(day);

            <p class="hint" id="fx-chqmaos" style="margin-top:6px"></p>
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:18px"><h3><span class="sec-n">5</span>Conferência</h3><div class="tablewrap" style="border:0" id="fx-conf"></div></div>
      <div class="card" style="margin-top:18px"><h3><span class="sec-n">6</span>Encerrar o dia</h3>
        <div class="stack">
          <label class="f"><span>Observações (explique diferenças)</span><textarea class="inp" id="fx-obs" rows="3" ${dis}>${h(fe.obs||"")}</textarea></label>
          <div class="row2"><label class="f"><span class="req">Fechado por</span><input class="inp" id="fx-por" value="${h(fe.fechadoPor||lsGet("cdd.operador")||"")}" ${dis}></label><span></span></div>
          <p class="hint">Lance sangrias, depósitos e transferências antes de fechar. O que ficar na gaveta vira a abertura do próximo dia.</p>
          <div class="btns" id="fx-acoes"></div>
          <p class="hint" id="fx-msg"></p>

function readFechInputs(){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():undefined;};
  const fe=S.fech; fe.sis=fe.sis||{}; fe.maq=fe.maq||{}; fe.ced=fe.ced||{};
  fe.abertDin=g("fx-abertDin"); fe.abertChq=g("fx-abertChq");
  ["din","pix","cart","chq"].forEach(k=>fe.sis[k]=g("fx-sis-"+k));
  ["deb","cred","pix"].forEach(k=>fe.maq[k]=g("fx-maq-"+k));
  CEDULAS.forEach(([k])=>fe.ced[k]=g("fx-ced-"+k));
  fe.chqGaveta=g("fx-chqGaveta"); fe.obs=g("fx-obs"); fe.fechadoPor=g("fx-por");
}
function fechParaCalc(){ const d={lanc:S.day.lanc, data:S.data, fech:Object.assign({},S.day.fech||{},S.fech)}; if(d.fech.abertDin==="") d.fech.abertDin=null; if(d.fech.abertChq==="") d.fech.abertChq=null; return d; }
function updateFechCalc(){
  if(S.frente==="banco"||!$("#fx-conf")) return;
  const day=fechParaCalc(), c=calcDia(day,S.prev), rows=conferencia(c), fechado=diaFechado(S.day);
  CEDULAS.forEach(([k,val])=>{const el=document.getElementById("fx-tot-"+k); if(el) el.textContent=fmtS((parseInt(S.fech.ced&&S.fech.ced[k],10)||0)*val);});
  const ct=$("#fx-contado"); if(ct) ct.textContent=fmt(c.contado);
  const cm=$("#fx-chqmaos"); if(cm){ const l=chequesMaos(S.frente); cm.innerHTML=l.length?`Registrados em mãos aqui: ${l.length} cheque(s), <b class="num">${fmt(l.reduce((a,q)=>a+(+q.valor||0),0))}</b> — ${l.map(q=>h(q.emitente)+" "+fmt(q.valor)).join(", ")}`:"Nenhum cheque de cliente registrado em mãos nesta frente."; }
  $("#fx-conf").innerHTML=`<table class="conf"><thead><tr><th>Item</th><th class="r">Esperado</th><th class="r">Conferido</th><th class="r">Diferença</th><th>Situação</th></tr></thead><tbody>${
    rows.map(r=>{const ok=Math.abs(r.dif)<0.005; return `<tr><td>${h(r.item)}${r.obs?`<div class="sub2">${h(r.obs)}</div>`:""}</td><td class="r num">${fmt(r.esp)}</td><td class="r num">${fmt(r.conf)}</td><td class="r num ${ok?"":"dif-bad"}">${ok?"–":(r.dif>0?"+":"")+fmt(r.dif)}</td><td><span class="pill ${ok?"e":(r.dif<0?"s":"w")}">${ok?"OK":(r.dif<0?"Falta":"Sobra")}</span></td></tr>`;}).join("")}</tbody></table>`;
  const fe=S.day.fech||{};
  const b=$("#fech-banner"); if(b) b.innerHTML=fechado?`<div class="banner ok">Caixa fechado${fe.fechadoPor?" por "+h(fe.fechadoPor):""}${fe.fechadoEmTexto?" em "+h(fe.fechadoEmTexto):""}. ${fe.pdf&&(fe.pdf.path||fe.pdf.url)?`PDF salvo: <button class="linkbtn" style="color:inherit;text-decoration:underline" data-act="abrir-pdf" data-f="${h(S.frente)}" data-d="${h(S.data)}">${h(fe.pdf.nome||"abrir")}</button>.`:"O PDF ainda não foi salvo."}</div>`:"";
  const ac=$("#fx-acoes");
  if(ac) ac.innerHTML=fechado
    ?`${fe.pdf&&(fe.pdf.path||fe.pdf.url)?`<button class="btn" data-act="abrir-pdf" data-f="${h(S.frente)}" data-d="${h(S.data)}">Abrir PDF</button>`:""}<button class="btn pri" data-act="pdf-drive">${fe.pdf&&(fe.pdf.path||fe.pdf.url)?"Gerar PDF de novo":"Salvar PDF"}</button>${isAdmin()?`<button class="btn danger" data-act="reabrir">Reabrir dia</button>`:""}`
    :`<button class="btn loja" data-act="fechar">Fechar caixa e salvar PDF</button>`;
}
function agendaRascunho(){
  S.fechSujo=true; clearTimeout(S.saveT);
  S.saveT=setTimeout(async()=>{
    if(diaFechado(S.day)) return;
    const fe=S.fech;
    try{ await call("rascunhoFech",{frente:S.frente,data:S.data,fech:{abertDin:fe.abertDin,abertChq:fe.abertChq,sis:fe.sis,maq:fe.maq,ced:fe.ced,chqGaveta:fe.chqGaveta,obs:fe.obs,fechadoPor:fe.fechadoPor}});
      S.day.fech=Object.assign({},S.day.fech||{},fe,{status:"aberto"}); S.fechSujo=false; }
    catch(e){ const m=$("#fx-msg"); if(m) m.textContent="Rascunho não salvo: "+e.message; }
  },1500);
}
async function fecharCaixa(btn){
  readFechInputs(); const m=$("#fx-msg");
  if(!S.fech.fechadoPor){ m.textContent="Preencha quem está fechando."; $("#fx-por").focus(); return; }
  if(contagem(S.fech.ced)===0&&!S.confirmZero){ m.textContent="A contagem da gaveta está zerada. Clique de novo em Fechar para confirmar mesmo assim."; S.confirmZero=true; return; }
  S.confirmZero=false; lsSet("cdd.operador",S.fech.fechadoPor); clearTimeout(S.saveT);
  const d=fechParaCalc(), c=calcDia(d,S.prev), rows=conferencia(c), fe=S.fech;
  const registro={abertDin:c.abertDin,abertChq:c.abertChq,sis:fe.sis,maq:fe.maq,ced:fe.ced,chqGaveta:fe.chqGaveta,obs:fe.obs,fechadoPor:fe.fechadoPor,
    resumo:{entradas:c.totE,saidas:c.totS,espDin:c.espDin,contado:c.contado,difDin:r2(c.contado-c.espDin),espChq:c.espChq,chqGav:c.chqGav,ok:rows.every(r=>Math.abs(r.dif)<0.005)}};
  const agora=new Date(); const txt=pad(agora.getDate())+"/"+pad(agora.getMonth()+1)+"/"+agora.getFullYear()+" "+pad(agora.getHours())+":"+pad(agora.getMinutes());
  const pdf=pdfHtml({lanc:S.day.lanc,data:S.data,fech:Object.assign({},registro,{status:"fechado",fechadoEmTexto:txt})},S.frente);
  btn.disabled=true; m.textContent="Gerando o PDF…";
  let b64=null, erroPdf="";
  try{ b64=await htmlParaPdf(pdf.html); }catch(e){ erroPdf=e.message; }
  m.textContent="Fechando o caixa…";
  try{
    const r=await call("fechar",{frente:S.frente,data:S.data,fech:registro,pdf:b64,html:b64?"":pdf.html,nome:pdf.nome});
    const aviso=r.erro||"";
    m.textContent=aviso||"Caixa fechado e PDF salvo."; toast(aviso?"Caixa fechado.":"Caixa fechado e PDF salvo.");
    await carregarDia(true);
  }catch(e){ m.textContent=e.message; btn.disabled=false; }
}
async function pdfDeNovo(btn){
  const m=$("#fx-msg"); btn.disabled=true; m.textContent="Gerando o PDF…";
  try{ const pdf=pdfHtml(S.day,S.frente); let b64=null; try{ b64=await htmlParaPdf(pdf.html); }catch(e){} await call("pdf",{frente:S.frente,data:S.data,pdf:b64,html:b64?"":pdf.html,nome:pdf.nome}); m.textContent="PDF salvo."; await carregarDia(true); }
  catch(e){ m.textContent=e.message; btn.disabled=false; }
}
async function reabrir(){
  const m=$("#fx-msg");
  if(!S.confirmReabrir){ S.confirmReabrir=true; m.textContent="Clique de novo em Reabrir para confirmar. O fechamento volta a ser rascunho."; setTimeout(()=>S.confirmReabrir=false,6000); return; }
  S.confirmReabrir=false;
  try{ await call("reabrir",{frente:S.frente,data:S.data}); m.textContent="Dia reaberto."; await carregarDia(true); }catch(e){ m.textContent=e.message; }
}

// ---------- PDF (gerado no navegador e salvo no Drive pelo Apps Script) ----------
async function htmlParaPdf(html){
  if(!window.html2pdf) throw new Error("o gerador de PDF não carregou. Recarregue a página.");
  const box=document.createElement("div"); box.innerHTML=html; box.style.cssText="width:186mm;background:#ffffff;color:#111111";
  const uri=await window.html2pdf().set({margin:[10,12,12,12],html2canvas:{scale:2,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"],avoid:"tr"}}).from(box).outputPdf("datauristring");
  return String(uri).split(",")[1];
}

    .pdfdoc table{border-collapse:collapse;width:100%} .pdfdoc th,.pdfdoc td{border:1px solid #bbb;padding:3px 6px;vertical-align:top;color:#111}
    .pdfdoc th{background:#eee;text-align:left} .pdfdoc .r{text-align:right} .pdfdoc .ok{color:#1f7a45} .pdfdoc .bad{color:#b0362b}
  </style><div class="pdfdoc"><div class="bar"></div>
  <h1>Fechamento de caixa — ${h(f.nome)}</h1>
  <p class="sub">${br(day.data)} (${diaSemana(day.data)}) · Fechado por: ${h(fe.fechadoPor||"—")}${fe.fechadoEmTexto?" · "+h(fe.fechadoEmTexto):""}</p>
  <h2>1. Conferência</h2><table><tr><th>Item</th><th class="r">Esperado</th><th class="r">Conferido</th><th class="r">Diferença</th><th>Situação</th></tr>
  ${conf.map(r=>{const ok=Math.abs(r.dif)<0.005;return `<tr><td>${h(r.item)}</td><td class="r">${fmt(r.esp)}</td><td class="r">${fmt(r.conf)}</td><td class="r">${ok?"–":fmt(r.dif)}</td><td class="${ok?"ok":"bad"}"><b>${ok?"OK":(r.dif<0?"FALTA":"SOBRA")}</b></td></tr>`;}).join("")}</table>
  ${tab("2. Movimento por forma",["Forma","Entradas","Saídas"],fs.map(k=>[FORMAS[k],fmtS(c.E[k]),fmtS(c.S[k])]).concat([["Total",fmt(c.totE),fmt(c.totS)]]),[1,2])}
  ${tab("3. Referências",["Item","Valor"],[["Abertura em dinheiro",fmt(c.abertDin)],["Abertura em cheques",fmt(c.abertChq)],["Sistema – dinheiro",fmtS(num(sis.din))],["Sistema – PIX",fmtS(num(sis.pix))],["Sistema – cartão",fmtS(num(sis.cart))],["Sistema – cheque",fmtS(num(sis.chq))],["Maquininha – débito",fmtS(num(maq.deb))],["Maquininha – crédito",fmtS(num(maq.cred))],["Maquininha – PIX",fmtS(num(maq.pix))],["Dinheiro contado na gaveta",fmt(c.contado)],["Cheques na gaveta",fmt(c.chqGav)]],[1])}
  ${tab("4. Contagem da gaveta",["Cédula / moeda","Qtd.","Total"],CEDULAS.filter(([k])=>parseInt(ced[k],10)).map(([k,val,nome])=>[nome,String(parseInt(ced[k],10)),fmt(parseInt(ced[k],10)*val)]).concat([["Total contado","",fmt(c.contado)]]),[1,2])}
  ${tab("5. Lançamentos do dia",["Hora","Tipo","Descrição","Forma","Entrada","Saída"],lancsAtivos(day).map(l=>[l.hora||"",(TIPOS[l.tipo]||{}).nome||l.tipo,[l.desc,l.recebido?"recebeu "+fmt(l.recebido)+", troco "+fmt(l.troco):"",l.cartao?l.cartao+" "+l.parcelasN+"x":"",l.chequeNum?"cheque nº "+l.chequeNum+(l.bomPara?", bom para "+br(l.bomPara):""):"",l.chqTercEmit?"cheque de "+l.chqTercEmit+(l.chqTercNum?" nº "+l.chqTercNum:"")+(l.bomPara&&l.sentido==="E"?", bom para "+br(l.bomPara):""):"",l.repassadoPara?"repassado para "+l.repassadoPara:"",l.func,l.doc?"nº "+l.doc:"",l.obs,l.oper?"por "+l.oper:""].filter(Boolean).join(" · "),FORMAS[l.forma]||l.forma,l.sentido==="E"?fmt(l.valor):"",l.sentido==="S"?fmt(l.valor):""]),[4,5])}

    </div>

async function cadastrarConta(ev){
  ev.preventDefault(); const g=id=>document.getElementById(id).value.trim(), m=$("#c-msg");
  const a={forn:g("c-forn"),valor:num(g("c-valor")),venc:g("c-venc"),desc:g("c-desc"),loja:g("c-loja"),doc:g("c-doc"),rep:g("c-rep")==="fixa"?"fixa":(parseInt(g("c-rep"),10)||1)};
  if(!a.forn||a.valor<=0||!a.venc){ m.textContent="Preencha fornecedor, valor e vencimento."; return; }
  m.textContent="Salvando…";
  try{ const r=await call("addConta",a); toast(r.msg); m.textContent=""; ["c-forn","c-valor","c-desc","c-doc"].forEach(id=>document.getElementById(id).value=""); await carregarContas(); }
  catch(e){ m.textContent=e.message; }
}
async function confirmarPagamento(id,btn){
  const m=$("#p-msg"), a={id,frente:$("#p-frente").value,forma:$("#p-forma").value,data:$("#p-data").value,valor:num($("#p-valor").value),oper:lsGet("cdd.operador")||""};
  if(!a.data||a.valor<=0){ m.textContent="Confira data e valor."; return; }
  if(a.forma==="chq"){ const id=$("#p-cssel").value; if(!id){ m.textContent="Escolha qual cheque de cliente está sendo usado."; return; } a.chqTercId=id; a.repassadoPara=$("#p-cspara").value.trim(); }
  if(a.forma==="chqemp"){ const n=$("#p-chnum").value.trim(), b=$("#p-chbom").value; if(!n||!b){ m.textContent="Informe o número do cheque e o bom para."; return; } a.cheque={numero:n,bomPara:b,nominal:$("#p-chnom").value.trim()}; }
  btn.disabled=true; m.textContent="Lançando…";
  try{ const r=await call("pagarConta",a); if(a.forma==="chqemp") carregarCheques(); if(a.forma==="chq") carregarChequesTerc(); S.payingId=null; toast(r.msg); await carregarContas(); if(a.frente===S.frente&&a.data===S.data) carregarDia(true); }
  catch(e){ m.textContent=e.message; btn.disabled=false; }
}

function histLancs(){
  const out=[], hf=S.hf, q=hf.q.toLowerCase();
  for(const f of FRENTES){ if(!hf.frentes.includes(f.id)) continue;
    for(const d of S.hist.docs[f.id]||[]){ if(d.data<hf.de||d.data>hf.ate) continue;
      for(const l of lancsAtivos(d)){ if(hf.tipo&&l.tipo!==hf.tipo) continue;
        if(q&&![l.desc,l.func,l.doc,l.obs,l.oper,l.cartao].join(" ").toLowerCase().includes(q)) continue;
        out.push(Object.assign({},l,{frente:f.id,data:d.data})); } } }
  return out.sort((a,b)=>a.data.localeCompare(b.data)||(a.hora||"").localeCompare(b.hora||""));
}

  else if(act==="dia-next") setData(addDias(S.data,1));
  else if(act==="del"){ if(!armar(t,"Confirmar exclusão","Excluir")) return; t.disabled=true;
    try{ const r=await call("excluirLanc",{id:t.dataset.id}); toast(r.msg||"Excluído."); await carregarDia(true); carregarContas(); carregarReceber(); carregarCheques(); carregarChequesTerc(); }catch(e){ toast(e.message); t.disabled=false; } }
  else if(act==="fechar") fecharCaixa(t);
  else if(act==="ajustar") ajustarSaldo(t);
  else if(act==="reabrir") reabrir();
  else if(act==="pdf-drive") pdfDeNovo(t);
  else if(act==="pagar"){ S.payingId=S.payingId===t.dataset.id?null:t.dataset.id; S.editId=null; S.editOk=false; S.editSenha=""; renderContas(); }
  else if(act==="confirmar-pag") confirmarPagamento(t.dataset.id,t);
  else if(act==="alterar"){ if(S.editId===t.dataset.id){ S.editId=null; } else { S.editId=t.dataset.id; S.editOk=false; S.editSenha=""; S.payingId=null; } renderContas(); const e=$("#e-senha"); if(e) e.focus(); }
  else if(act==="liberar"){ const m=$("#e-msg"), s=$("#e-senha").value; if(!s){ m.textContent="Digite a senha."; return; } t.disabled=true; m.textContent="Conferindo…";
    try{ await call("liberarEdicao",{senha:s}); S.editOk=true; S.editSenha=s; renderContas(); const f=$("#e-valor"); if(f) f.focus(); }catch(e){ m.textContent=e.message; t.disabled=false; } }
  else if(act==="salvar-edicao"){ const m=$("#e-msg"), g=id=>(document.getElementById(id)||{}).value||"";
    const campos={forn:g("e-forn").trim(),valor:num(g("e-valor")),venc:g("e-venc"),desc:g("e-desc").trim(),loja:g("e-loja"),doc:g("e-doc").trim()};
    if(!campos.forn||campos.valor<=0||!campos.venc){ m.textContent="Preencha fornecedor, valor e vencimento."; return; }
    t.disabled=true; m.textContent="Salvando…";
    try{ const r=await call("editarConta",{id:t.dataset.id,senha:S.editSenha,campos,aplicarProximas:!!(document.getElementById("e-prox")||{}).checked}); S.editId=null; S.editOk=false; S.editSenha=""; toast(r.msg); await carregarContas(); }
    catch(e){ m.textContent=e.message; t.disabled=false; } }
  else if(act==="encerrar-fixa"){ if(!armar(t,"Confirmar encerramento","Encerrar conta fixa a partir deste mês")) return; const m=$("#e-msg");
    try{ const r=await call("encerrarFixa",{id:t.dataset.id,senha:S.editSenha}); S.editId=null; S.editOk=false; S.editSenha=""; toast(r.msg); await carregarContas(); }catch(e){ m.textContent=e.message; } }
  else if(act==="del-conta"){ if(!armar(t,"Confirmar","Excluir")) return; try{ const r=await call("excluirConta",{id:t.dataset.id}); toast(r.msg||"Excluída."); carregarContas(); }catch(e){ toast(e.message); } }
  else if(act==="ct-abrir"){ S.ctId=S.ctId===t.dataset.id?null:t.dataset.id; renderContas(); }
  else if(act==="ct-devolver"){ if(!armar(t,"Confirmar devolução","Marcar como devolvido")) return; try{ const r=await call("devolverChequeTerc",{id:t.dataset.id,motivo:$("#ct-motivo").value.trim()}); S.ctId=null; toast(r.msg); carregarChequesTerc(); }catch(e){ $("#ct-msg").textContent=e.message; } }
  else if(act==="chq-abrir"){ S.chqId=S.chqId===t.dataset.id?null:t.dataset.id; renderContas(); }
  else if(act==="chq-compensar"){ const m=$("#q-msg"); t.disabled=true; m.textContent="Lançando…";
    try{ const r=await call("compensarCheque",{id:t.dataset.id,data:$("#q-data").value,oper:lsGet("cdd.operador")||""}); S.chqId=null; toast(r.msg); await carregarCheques(); if(S.frente==="banco") carregarDia(true); }catch(e){ m.textContent=e.message; t.disabled=false; } }
  else if(act==="chq-devolvido"||act==="chq-cancelado"){ if(!armar(t,"Confirmar",act==="chq-devolvido"?"Devolvido":"Cancelado")) return; const m=$("#q-msg");
    try{ const r=await call("baixarCheque",{id:t.dataset.id,status:act==="chq-devolvido"?"devolvido":"cancelado",motivo:$("#q-motivo").value.trim()}); S.chqId=null; toast(r.msg); await carregarCheques(); carregarContas(); }catch(e){ m.textContent=e.message; } }
  else if(act==="chq-desfazer"){ if(!armar(t,"Confirmar desfazer","Desfazer")) return; try{ const r=await call("desfazerCompensacao",{id:t.dataset.id}); toast(r.msg); await carregarCheques(); if(S.frente==="banco") carregarDia(true); }catch(e){ toast(e.message); } }
  else if(act==="rec-abrir"){ S.recId=S.recId===t.dataset.id?null:t.dataset.id; renderReceber(); }
  else if(act==="rec-confirmar"){ const m=$("#r-msg"), a={id:t.dataset.id,data:$("#r-data").value,valor:num($("#r-valor").value),oper:lsGet("cdd.operador")||""};
    if(!a.data||a.valor<=0){ m.textContent="Confira data e valor."; return; } t.disabled=true; m.textContent="Lançando…";
    try{ const r=await call("confirmarReceb",a); S.recId=null; toast(r.msg); await carregarReceber(); if(S.frente==="banco") carregarDia(true); }catch(e){ m.textContent=e.message; t.disabled=false; } }
  else if(act==="rec-desfazer"){ if(!armar(t,"Confirmar desfazer","Desfazer")) return; try{ const r=await call("desfazerReceb",{id:t.dataset.id}); toast(r.msg); carregarReceber(); }catch(e){ toast(e.message); } }
  else if(act==="del-bol"){ if(!armar(t,"Confirmar","Excluir")) return; try{ const r=await call("excluirBoleto",{id:t.dataset.id}); toast(r.msg||"Excluído."); carregarReceber(); }catch(e){ toast(e.message); } }
  else if(act==="h-atualizar"){ S.hist=null; $("#h-body").innerHTML=`<div class="empty">Carregando o histórico…</div>`; carregarContas(); carregarReceber(); carregarCheques(); carregarChequesTerc(); carregarHist(); }
  else if(act==="h-csv") exportCsv(t);
});
document.addEventListener("submit", async ev=>{
  const id=ev.target.id; ev.preventDefault();
  if(id==="f-lanc") salvarLanc(ev);
  else if(id==="f-conta") cadastrarConta(ev);
  else if(id==="f-boleto") cadastrarBoleto(ev);
  else if(id==="f-cfg") salvarConfig(ev);
  else if(id==="f-login"){
    const perfil=perfilLogin(), m=$("#lg-msg");
    if(!perfil){ m.textContent="Escolha a cidade (ou Administrador)."; return; }
    m.textContent="Entrando…"; $("#lg-entrar").disabled=true;
    try{ await entrar(perfil,$("#lg-senha").value); m.textContent=""; }catch(e){ m.textContent=e.message; }
    $("#lg-entrar").disabled=false;
  }
});
document.addEventListener("input", ev=>{
  const id=ev.target.id||"";
  if(id==="aj-real"){ atualizaDifAjuste(); return; }
  if(id==="l-valor"||id==="l-receb"){ updateTroco(); updateCC(); updateBolPrev(); return; }
  if(id==="l-cartao"){ const sug=vencCartaoSugerido(ev.target.value.trim()), vv=$("#l-ccvenc"); if(sug&&vv&&!vv.value){ vv.value=sug; updateCC(); } return; }
  if(id.startsWith("fx-")){ readFechInputs(); updateFechCalc(); agendaRascunho(); }
  else if(id==="hf-q"){ S.hf.q=ev.target.value; clearTimeout(S.qT); S.qT=setTimeout(renderHistBody,250); }
});
document.addEventListener("change", ev=>{
  const id=ev.target.id||"";
  if(id==="dia") setData(ev.target.value);
  else if(id==="l-forma"){ updateTroco(); updateCC(); updateChq(); }
  else if(id==="p-forma"||id==="p-cssel") syncPayChq();
  else if(id==="l-cssel") aplicaChequeSel();
  else if(id==="l-ccvenc"||id==="l-parc"){ updateCC(); updateBolPrev(); }
  else if(id==="l-venc") updateBolPrev();
  else if(id==="l-conta"){ const c=S.contas.find(x=>x.id===ev.target.value); if(c){ $("#l-valor").value=numStr(c.valor); $("#l-desc").value=c.forn+(c.desc?" · "+c.desc:""); $("#l-doc").value=c.doc||""; updateCC(); } }
  else if(id==="p-frente"){ const sel=$("#p-cssel"); if(sel) sel.dataset.fr=""; syncPayForma(); }
  else if(id==="hf-de"){ S.hf.de=ev.target.value; renderHistBody(); }
  else if(id==="hf-ate"){ S.hf.ate=ev.target.value; renderHistBody(); }
  else if(id==="hf-tipo"){ S.hf.tipo=ev.target.value; renderHistBody(); }
});

// ---------- início ----------
(function boot(){
  let sess=null; try{ sess=JSON.parse(lsGet("cdd.sess")||"null"); }catch(e){}
  if(sess&&sess.token&&temGoogle){
    S.token=sess.token; S.perfil=sess.perfil;
    call("config").then(cfg=>{ S.config=cfg; iniciarSessao({token:sess.token,perfil:cfg.perfil}); }).catch(()=>mostrarLogin());
  } else mostrarLogin();
})();
})();

</script>
